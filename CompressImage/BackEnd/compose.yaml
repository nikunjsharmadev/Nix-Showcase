services:
  api:
    build: .
    ports:
      - '5000:5000'
    env_file:
      - .env.docker
    volumes:
      - uploads:/app/uploads

  worker:
    build: .
    command: npm run worker
    depends_on:
      - redis
    volumes:
      - uploads:/app/uploads
  redis:
    image: redis:7-alpine
    container_name: redis

    ports:
      - '6379:6379'
    restart: unless-stopped

    volumes:
      - redis-data:/data

volumes:
  uploads:
  redis-data:
