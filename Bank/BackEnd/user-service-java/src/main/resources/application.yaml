spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/bank
    username: root
    password: NewPassword123!
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
  mvc:
    throw-exception-if-no-handler-found: true
  session:
    store-type: jdbc
    timeout: 30m
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  cache:
    cache-names:
      - users
      - products
    redis:
      time-to-live: 10m
      cache-null-values: false
  session:
    redis:
      namespace: myapp:session
    store-type: redis
    timeout: 30m
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
